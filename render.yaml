services:
  - type: web
    name: ai-daily-learn
    runtime: node
    buildCommand: |
      echo "=== Current directory ===" && pwd && ls -la
      echo "=== Backend setup ===" && cd backend && npm install && npx prisma migrate deploy && node prisma/seed.js
      echo "=== Frontend build ===" && cd ../ai-daily-learn && npm install && npm run build
      echo "=== Copy frontend ===" && mkdir -p ../backend/public && cp -r dist/* ../backend/public/ && ls -la ../backend/public/
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: ai-daily-learn-secret-key-change-in-production
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
